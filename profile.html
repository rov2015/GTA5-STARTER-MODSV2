<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="app-icon.ico" type="image/x-icon"><link rel="manifest" href="site.webmanifest"><title>Profile Settings | GTA5 Mod Starter</title>
<style>
:root { color-scheme:dark; --ink:#f6f2e9; --muted:#aaa99f; --line:rgba(255,255,255,.18); --panel:rgba(8,14,10,.7); --green:#b7ef73; --orange:#ff9c66; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); font-family:"Segoe UI","Trebuchet MS",sans-serif; background:#183b1b linear-gradient(90deg,rgba(35,83,32,.58),rgba(25,58,24,.45) 48%,rgba(2,7,4,.82)),url("https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png") center/cover fixed; } .shell { width:min(760px,calc(100% - 32px)); margin:auto; padding:26px 0 60px; } header { display:flex; justify-content:space-between; align-items:center; padding-bottom:22px; border-bottom:1px solid var(--line); } .brand { font-weight:700; } .mark { display:inline-block; width:11px; height:11px; margin-right:9px; border-radius:50%; background:var(--green); box-shadow:0 0 16px var(--green); } nav { display:flex; gap:18px; font-size:.78rem; } nav a { color:var(--muted); text-decoration:none; } nav a:hover { color:var(--green); } main { padding-top:64px; } .kicker { color:var(--green); font-size:.74rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:14px 0 32px; font-size:clamp(3rem,8vw,5.6rem); line-height:.9; letter-spacing:-.06em; } .panel { max-width:540px; padding:28px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:12px 12px 0 rgba(255,156,102,.08); backdrop-filter:blur(14px); } h2 { margin:0 0 20px; font-size:1.45rem; } .identity { margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--line); } .identity small { display:block; margin-bottom:7px; color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.1em; } .identity strong { font-size:1.3rem; } label { display:block; margin:16px 0 7px; color:var(--muted); font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } input { width:100%; padding:12px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:rgba(0,0,0,.28); font:inherit; } input:focus { outline:2px solid var(--green); } button { border:1px solid var(--green); border-radius:4px; padding:12px 16px; color:#10150d; background:var(--green); font-weight:700; cursor:pointer; } .save { width:100%; margin-top:22px; } .message { min-height:20px; margin:12px 0 0; color:var(--orange); font-size:.8rem; } .signout { margin-top:28px; border-color:var(--orange); color:var(--orange); background:transparent; } @media(max-width:560px) { nav { display:none; } main { padding-top:42px; } .panel { padding:22px; } }
</style></head>
<body><div class="shell"><header><div class="brand"><span class="mark"></span> GTA5 Mod Starter</div><nav aria-label="Main navigation"><a href="mods-library.html">UPLOAD</a><a href="discover.html">DISCOVER</a></nav></header><main><div class="kicker">Account</div><h1>Profile settings.</h1><section class="panel" aria-labelledby="settings-title"><h2 id="settings-title">Your profile</h2><div class="identity"><small>Signed in as</small><strong id="username">Loading...</strong></div><form id="passwordForm"><h2>Change password</h2><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" required><button class="save" type="submit">Save new password</button><p class="message" id="message" aria-live="polite"></p></form><button class="signout" id="signout" type="button">Sign out</button></section></main></div>
<script>
const session=JSON.parse(localStorage.getItem("gta5-session")||"null");
if(!session?.token) window.location.href="signin.html";
const username=document.querySelector("#username"), form=document.querySelector("#passwordForm"), message=document.querySelector("#message");
async function loadProfile(){try{const response=await fetch("/api/me",{headers:{Authorization:`Bearer ${session.token}`}});if(!response.ok)throw new Error("Session expired");const data=await response.json();username.textContent=data.username;}catch(error){localStorage.removeItem("gta5-session");window.location.href="signin.html";}}
loadProfile();
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="Saving...";try{const response=await fetch("/api/change-password",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.token}`},body:JSON.stringify({currentPassword:form.currentPassword.value,newPassword:form.newPassword.value})});const data=await response.json();if(!response.ok)throw new Error(data.error);form.reset();message.textContent=data.message;}catch(error){message.textContent=error.message||"Could not update password.";}});
document.querySelector("#signout").addEventListener("click",()=>{localStorage.removeItem("gta5-session");window.location.href="signin.html";});
</script></body></html>
