<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="app-icon.ico" type="image/x-icon"><link rel="manifest" href="site.webmanifest"><title>View Mod | GTA5 Mod Starter</title>
<style>
:root { color-scheme:dark; --ink:#f6f2e9; --muted:#aaa99f; --line:rgba(255,255,255,.16); --panel:rgba(8,14,10,.7); --green:#b7ef73; --orange:#ff9c66; } * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); font-family:"Segoe UI","Trebuchet MS",sans-serif; background:#183b1b linear-gradient(90deg,rgba(35,83,32,.58),rgba(25,58,24,.45) 48%,rgba(2,7,4,.82)),url("https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png") center/cover fixed; } .shell { width:min(980px,calc(100% - 32px)); margin:auto; padding:26px 0 60px; } header { display:flex; align-items:center; justify-content:space-between; padding-bottom:22px; border-bottom:1px solid var(--line); } .brand { font-weight:700; } .mark { display:inline-block; width:11px; height:11px; margin-right:9px; border-radius:50%; background:var(--green); box-shadow:0 0 16px var(--green); } nav { display:flex; gap:10px; font-size:.78rem; font-weight:800; letter-spacing:.08em; } nav a { padding:9px 11px; border:1px solid transparent; border-radius:4px; color:var(--muted); text-decoration:none; } nav a:hover { border-color:var(--green); color:#10150d; background:var(--green); } main { padding-top:64px; } .mod-view { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.9fr); gap:28px; align-items:start; padding:20px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:12px 12px 0 rgba(255,156,102,.08); } .mod-image { display:block; width:100%; max-height:520px; border-radius:5px; object-fit:cover; background:#253626; } .kicker { color:var(--green); font-size:.74rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:14px 0 10px; font-size:clamp(2.5rem,6vw,5rem); line-height:.92; letter-spacing:-.06em; overflow-wrap:anywhere; } .creator { margin-bottom:24px; color:var(--green); font-size:.82rem; font-weight:700; } .description { color:#d7d7c7; font-size:1rem; line-height:1.65; } .stats { display:flex; gap:22px; margin:28px 0; color:var(--muted); font-size:.8rem; } .download { display:inline-block; padding:13px 18px; border:1px solid var(--green); border-radius:4px; color:#10150d; background:var(--green); font-weight:800; text-decoration:none; } .back { display:inline-block; margin-top:22px; color:var(--muted); font-size:.8rem; text-decoration:none; } .back:hover { color:var(--green); } .error { padding:40px; border:1px dashed var(--line); color:var(--orange); text-align:center; } @media(max-width:700px) { nav { display:none; } main { padding-top:42px; } .mod-view { grid-template-columns:1fr; padding:14px; } }
</style></head>
<body><div class="shell"><header><div class="brand"><span class="mark"></span> GTA5 Mod Starter</div><nav aria-label="Main navigation"><a href="Untitled-1.html">HOME</a><a href="mods-library.html">UPLOAD</a><a href="discover.html">DISCOVER</a><a href="profile.html">PROFILE</a></nav></header><main id="main"><p class="error">Loading mod...</p></main></div>
<script>
const main=document.querySelector("#main"), defaultImage="https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png";
async function loadMod(){try{const fileUrl=new URLSearchParams(location.search).get("file");const mods=await fetch("/api/mods").then(response=>response.json());const mod=mods.find(item=>item.fileUrl===fileUrl);if(!mod)throw new Error("Mod not found.");const download=`/api/download?file=${encodeURIComponent(mod.fileUrl)}`;main.innerHTML=`<article class="mod-view"><img class="mod-image" src="${mod.image||defaultImage}" alt="${mod.title} cover"><div><div class="kicker">Mod details</div><h1>${mod.title}</h1><div class="creator">By ${mod.username||"Community creator"}</div><p class="description">${mod.description}</p><div class="stats"><span>${mod.downloads||0} downloads</span><span>${mod.fileName}</span></div><a class="download" download="${mod.fileName}" href="${download}">Download mod</a><br><a class="back" href="discover.html">Back to Discover</a></div></article>`;document.title=`${mod.title} | GTA5 Mod Starter`;}catch(error){main.innerHTML=`<p class="error">${error.message||"This mod could not be loaded."}<br><a class="back" href="discover.html">Back to Discover</a></p>`;}}
loadMod();
</script></body></html>
