<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="app-icon.ico" type="image/x-icon"><link rel="manifest" href="site.webmanifest"><title>Sign up | GTA5 Mod Starter</title>
<style>
:root { color-scheme:dark; --ink:#f6f2e9; --muted:#aaa99f; --line:rgba(255,255,255,.18); --panel:rgba(8,14,10,.7); --green:#b7ef73; --orange:#ff9c66; } * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font-family:"Segoe UI","Trebuchet MS",sans-serif; background:#183b1b linear-gradient(90deg,rgba(35,83,32,.58),rgba(25,58,24,.45) 48%,rgba(2,7,4,.82)),url("https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png") center/cover fixed; } .auth { width:min(440px,calc(100% - 32px)); padding:34px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:12px 12px 0 rgba(255,156,102,.08); backdrop-filter:blur(14px); } .brand { margin-bottom:42px; font-weight:700; } .mark { display:inline-block; width:11px; height:11px; margin-right:9px; border-radius:50%; background:var(--green); box-shadow:0 0 16px var(--green); } .kicker { color:var(--green); font-size:.74rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:14px 0 24px; font-size:3.4rem; line-height:.9; letter-spacing:-.06em; } label { display:block; margin:16px 0 7px; color:var(--muted); font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } input { width:100%; padding:12px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:rgba(0,0,0,.28); font:inherit; } input:focus { outline:2px solid var(--green); } button { width:100%; margin-top:22px; padding:13px; border:1px solid var(--green); border-radius:4px; color:#10150d; background:var(--green); font-weight:700; cursor:pointer; } .message { min-height:20px; color:var(--orange); font-size:.8rem; } .switch { margin:22px 0 0; color:var(--muted); font-size:.82rem; } a { color:var(--green); }
</style></head>
<body><main class="auth"><div class="brand"><span class="mark"></span> GTA5 Mod Starter</div><div class="kicker">Join the library</div><h1>Sign up.</h1><form id="authForm"><label for="username">Username</label><input id="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]+" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><button type="submit">Create account</button><p class="message" id="message" aria-live="polite"></p></form><p class="switch">Already have an account? <a href="signin.html">Sign in</a></p></main>
<script>
const form=document.querySelector("#authForm"), message=document.querySelector("#message");
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="Creating account...";try{const response=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:form.username.value,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error);localStorage.setItem("gta5-session",JSON.stringify(data));window.location.href="mods-library.html";}catch(error){message.textContent=error.message||"Sign up failed.";}});
</script></body></html>
