<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="app-icon.ico" type="image/x-icon">
	<link rel="manifest" href="site.webmanifest">
	<title>Discover GTA5 Mods</title>
	<style>
		:root { color-scheme: dark; --ink: #f6f2e9; --muted: #aaa99f; --line: rgba(255,255,255,.16); --panel: rgba(8,14,10,.62); --green: #b7ef73; --orange: #ff9c66; --red: #ff7969; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Segoe UI", "Trebuchet MS", sans-serif; background: #183b1b linear-gradient(90deg, rgba(35,83,32,.28), rgba(25,58,24,.18) 48%, rgba(2,7,4,.42)), url("https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png") center / cover fixed; }
		body::before { position: fixed; z-index: -1; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 38px, rgba(255,255,255,.018) 39px 40px); content: ""; }
		.shell { width: min(1180px, calc(100% - 40px)); margin: auto; padding: 26px 0 60px; }
		header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
		.brand { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; }
		.mark { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 18px var(--green); }
		nav { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .78rem; font-weight: 800; letter-spacing: .08em; }
		nav a { padding: 9px 11px; border: 1px solid transparent; border-radius: 4px; color: inherit; text-decoration: none; transition: color .2s, border-color .2s, background .2s; }
		nav a:hover, nav a.active { border-color: var(--green); color: #10150d; background: var(--green); }
		main { padding-top: 62px; }
		.kicker { color: var(--green); font-size: .74rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 16px 0 12px; font-size: clamp(3rem, 8vw, 6.4rem); line-height: .9; letter-spacing: -.06em; }
		.lede { max-width: 650px; margin: 0 0 42px; color: #d7d7c7; font-size: 1.05rem; line-height: 1.6; }
		.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
		h2 { margin: 0; font-size: 1.6rem; }
		.count { color: var(--muted); font-size: .78rem; }
		.search { width: min(420px, 100%); margin: 0 0 24px auto; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: rgba(0,0,0,.34); font: inherit; }
		.search:focus { outline: 2px solid var(--green); outline-offset: 2px; }
		.toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 24px; }
		.toolbar .search { width: min(420px, 100%); margin: 0; }
		.layout-toggle { display: flex; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
		.layout-toggle button { border: 0; border-right: 1px solid var(--line); padding: 0 13px; color: var(--muted); background: rgba(0,0,0,.34); font: 800 .76rem "Trebuchet MS", sans-serif; cursor: pointer; }
		.layout-toggle button:last-child { border-right: 0; }
		.layout-toggle button:hover, .layout-toggle button.active { color: #10150d; background: var(--green); }
		.mod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
		.mod-grid.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.mod-grid.compact .mod-card { display: block; min-height: 0; }
		.mod-grid.compact .mod-image { height: 150px; min-height: 0; }
		.mod-grid.compact .mod-content { padding: 15px; }
		.mod-grid.compact .mod-content p { min-height: 42px; -webkit-line-clamp: 2; }
		.mod-grid.list { grid-template-columns: 1fr; gap: 10px; }
		.mod-grid.list .mod-card { display: grid; grid-template-columns: 110px minmax(0, 1fr); min-height: 130px; box-shadow: none; }
		.mod-grid.list .mod-image { min-height: 130px; }
		.mod-grid.list .mod-content { display: grid; grid-template-columns: minmax(150px, .7fr) minmax(180px, 1.4fr) auto; gap: 16px; align-items: center; padding: 15px 18px; }
		.mod-grid.list .mod-content h3, .mod-grid.list .mod-content p { margin: 0; min-height: 0; }
		.mod-grid.list .creator { margin: 3px 0 0; }
		.mod-grid.list .mod-actions { display: grid; gap: 7px; }
		.mod-grid.list .download-count { grid-column: 3; }
		.mod-grid.list .view, .mod-grid.list .delete { grid-column: 3; }
		.mod-card { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 12px 12px 0 rgba(255,156,102,.07); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
		.mod-card { display: grid; grid-template-columns: 180px minmax(0, 1fr); min-height: 190px; }
		.mod-image { display: block; width: 100%; height: 100%; min-height: 190px; object-fit: cover; background: #253626; }
		.mod-content { display: flex; min-width: 0; flex-direction: column; padding: 20px; }
		.mod-content h3 { margin: 0 0 8px; font-size: 1.25rem; }
		.creator { margin: -2px 0 10px; color: var(--green); font-size: .74rem; font-weight: 700; }
		.mod-content p { display: -webkit-box; min-height: 52px; margin: 0 0 18px; overflow: hidden; color: var(--muted); font-size: .88rem; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
		.mod-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
		.download { padding: 9px 13px; border: 1px solid var(--green); border-radius: 4px; color: var(--green); font-size: .78rem; font-weight: 700; text-decoration: none; }
		.download:hover { color: #10150d; background: var(--green); }
		.view { color: var(--muted); font-size: .76rem; font-weight: 700; text-decoration: none; }
		.view:hover { color: var(--green); }
		.file-meta { max-width: 58%; color: var(--muted); font-size: .7rem; overflow-wrap: anywhere; }
		.download-count { color: var(--muted); font-size: .72rem; }
		.delete { margin-top: 14px; border: 0; padding: 0; color: var(--red); background: none; font-size: .72rem; cursor: pointer; }
		.empty { grid-column: 1 / -1; padding: 44px 20px; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
		.community { margin-top: 56px; }
		.community .mod-card { box-shadow: none; }
		@media (max-width: 900px) { .mod-grid, .mod-grid.compact { grid-template-columns: 1fr; } .mod-grid.list .mod-content { grid-template-columns: 1fr 1fr; } .mod-grid.list .download-count, .mod-grid.list .view, .mod-grid.list .delete { grid-column: auto; } }
		@media (max-width: 560px) { .shell { width: min(100% - 28px, 520px); } nav { display: none; } main { padding-top: 42px; } .mod-grid { grid-template-columns: 1fr; } .mod-card, .mod-grid.list .mod-card { display: block; } .mod-image, .mod-grid.list .mod-image { height: 180px; min-height: 0; } .mod-grid.list .mod-content { display: flex; flex-direction: column; align-items: stretch; gap: 8px; } .search { margin-left: 0; } h1 { overflow-wrap: anywhere; } }
	</style>
</head>
<body>
	<div class="shell">
		<header>
			<div class="brand"><span class="mark"></span> GTA5 Mod Starter</div>
			<nav aria-label="Main navigation"><a href="Untitled-1.html">HOME</a><a href="mods-library.html">UPLOAD</a><a class="active" href="discover.html">DISCOVER</a><a href="profile.html">PROFILE</a></nav>
		</header>
		<main>
			<div class="kicker">Fresh from the shelf</div>
			<h1>Discover mods.</h1>
			<p class="lede">Uploaded mods appear here after you add them. Browse your saved collection, view details, and download files.</p>
			<section aria-labelledby="uploaded-title">
				<div class="section-head"><h2 id="uploaded-title">Uploaded mods</h2><span class="count" id="modCount"></span></div>
				<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search mods, creators, or files" aria-label="Search mods"><div class="layout-toggle" aria-label="Choose mod layout"><button type="button" data-layout="wide" class="active">WIDE</button><button type="button" data-layout="compact">GRID</button><button type="button" data-layout="list">LIST</button></div></div>
				<div class="mod-grid" id="modGrid"></div>
			</section>
		</main>
	</div>
	<script>
		const storageKey = "gta5-mod-library";
		const defaultImage = "https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png";
		const modGrid = document.querySelector("#modGrid");
		const modCount = document.querySelector("#modCount");
		const search = document.querySelector("#search");
		const layoutToggle = document.querySelector(".layout-toggle");
		const session = JSON.parse(localStorage.getItem("gta5-session") || "null");
		let layout = localStorage.getItem("gta5-mod-layout") || "wide";
		let mods = JSON.parse(localStorage.getItem(storageKey) || "[]");
		function saveMods() { localStorage.setItem(storageKey, JSON.stringify(mods)); }
		function firstTwoSentences(text) {
			const sentences = text.match(/[^.!?]+[.!?]+(?:\s|$)/g);
			return sentences ? sentences.slice(0, 2).join("").trim() : text;
		}
		function renderMods() {
			modGrid.classList.toggle("compact", layout === "compact");
			modGrid.classList.toggle("list", layout === "list");
			layoutToggle.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button.dataset.layout === layout));
			const query = search.value.trim().toLowerCase();
			const visibleMods = mods.filter((mod) => [mod.title, mod.username, mod.description, mod.fileName].some((value) => String(value || "").toLowerCase().includes(query)));
			modCount.textContent = `${visibleMods.length}${query ? ` of ${mods.length}` : ""} ${visibleMods.length === 1 ? "mod" : "mods"}`;
			modGrid.replaceChildren();
			if (!visibleMods.length) {
				const empty = document.createElement("p");
				empty.className = "empty";
				empty.textContent = query ? "No mods match that search." : "No uploads yet. Add a mod from the upload page.";
				modGrid.append(empty);
				return;
			}
			visibleMods.forEach((mod) => {
				const card = document.createElement("article");
				card.className = "mod-card";
				const ownerControls = session?.username && mod.username && session.username === mod.username ? `<button class="delete" type="button" data-file-url="${mod.fileUrl || ""}">Remove</button>` : "";
				const downloadLink = mod.fileUrl ? `/api/download?file=${encodeURIComponent(mod.fileUrl)}` : mod.fileData;
				const viewLink = mod.fileUrl ? `<a class="view" href="mod-view.html?file=${encodeURIComponent(mod.fileUrl)}">View mod</a>` : "";
				card.innerHTML = `<img class="mod-image" src="${mod.image || defaultImage}" alt="${mod.title} cover" loading="lazy"><div class="mod-content"><h3>${mod.title}</h3><div class="creator">By ${mod.username || "Community creator"}</div><p>${firstTwoSentences(mod.description)}</p><div class="mod-actions"><span class="file-meta">${mod.fileName}</span><a class="download" download="${mod.fileName}" href="${downloadLink}">Download</a></div><div class="download-count">${mod.downloads || 0} downloads</div>${viewLink} ${ownerControls}</div>`;
				modGrid.append(card);
			});
		}
		modGrid.addEventListener("click", async (event) => {
			if (!event.target.matches(".delete")) return;
			const response = await fetch("/api/delete", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${session?.token || ""}` }, body: JSON.stringify({ fileUrl: event.target.dataset.fileUrl }) });
			if (response.ok) {
				await loadMods();
			}
		});
		search.addEventListener("input", renderMods);
		layoutToggle.addEventListener("click", (event) => {
			if (!event.target.matches("button")) return;
			layout = event.target.dataset.layout;
			localStorage.setItem("gta5-mod-layout", layout);
			renderMods();
		});
		async function loadMods() {
			try {
				const response = await fetch("/api/mods");
				if (!response.ok) throw new Error("Catalog unavailable");
				mods = await response.json();
			} catch (error) {
				mods = JSON.parse(localStorage.getItem(storageKey) || "[]");
			}
			renderMods();
		}
		loadMods();
	</script>
</body>
</html>
